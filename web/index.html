<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dart Up! - Real-time space gladiator combat and tactical drone swarm operations.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f97316">

  <!-- iOS / Apple meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dart Up!">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Preconnect to external asset CDNs with anonymous CORS -->
  <link rel="preconnect" href="https://assets.sunshade.icu" crossorigin="anonymous">
  <link rel="dns-prefetch" href="https://assets.sunshade.icu">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dart Up!</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Ensure external Kenney/R2 assets load with anonymous CORS (crossOrigin = 'anonymous')
    const _OrigImage = window.Image;
    if (_OrigImage) {
      window.Image = class extends _OrigImage {
        constructor(width, height) {
          super(width, height);
          this.crossOrigin = 'anonymous';
        }
      };
    }
    const _origCreateElement = document.createElement.bind(document);
    document.createElement = function(tagName, options) {
      const el = _origCreateElement(tagName, options);
      if (tagName && tagName.toLowerCase() === 'img') {
        el.crossOrigin = 'anonymous';
      }
      return el;
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
